name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Build warehouse and run SQL analysis
        run: |
          python -m patient_flow.generate
          python -m patient_flow.load
          python -m patient_flow.run_queries

  r:
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: |
          python -m patient_flow.generate
          python -m patient_flow.load
      - name: Install R packages
        run: |
          sudo apt-get update
          sudo apt-get install -y r-base-core r-cran-dplyr r-cran-ggplot2 \
            r-cran-rsqlite r-cran-dbi r-cran-testthat r-cran-survival
      - name: Run R tests
        run: Rscript -e 'testthat::test_dir("r/tests/testthat", stop_on_failure = TRUE)'
      - name: Run survival analysis
        run: Rscript r/analysis.R data/patient_flow.db
